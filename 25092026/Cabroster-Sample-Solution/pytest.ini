[pytest]
pythonpath = . tests
testpaths = tests
addopts = -ra -p no:cacheprovider
markers =
    simple: smoke-level suite, 1-2 happy-path checks per API
    full: exhaustive functional / behavioural / edge-case suite
    stretch: tests for Stretch backlog items (reports) - excluded from the pass mark
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
