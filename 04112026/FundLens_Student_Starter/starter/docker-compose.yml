# docker compose up --build   (expects the kit copied into ./kit, see README_STARTER)
services:
  api:
    build: .
    env_file: .env
    environment:
      FUNDLENS_KIT_DIR: /app/kit
    volumes:
      - ./.index:/app/.index
      - ./.data:/app/.data
    ports: ["8000:8000"]
  ui:
    build: .
    command: streamlit run ui/app.py --server.port 8501 --server.address 0.0.0.0
    environment:
      FUNDLENS_API_URL: http://api:8000
    ports: ["8501:8501"]
    depends_on: [api]
